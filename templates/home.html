{% extends "layout.html" %}

{% block content %}

  {% for post in posts %}

    <article
      class="mb-4 rounded-lg border border-gray-200 bg-white px-6 py-4 shadow-sm dark:border-gray-800 dark:bg-gray-900"
    >

      <div class="flex items-start gap-4">

        <!-- Profile Image -->
        <img
          class="h-16 w-16 shrink-0 rounded-full object-cover"
          src="{{ url_for('static', path='profile_pics/default.jpg') }}"
          alt="{{ post.author }}'s profile picture"
          width="64"
          height="64"
          loading="lazy"
        >

        <!-- Post Content -->
        <div class="min-w-0 flex-1">

          <!-- Author & Date -->
          <div class="mb-2 flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">

            <a
              class="font-medium text-blue-600 hover:text-blue-800 hover:underline dark:text-blue-400 dark:hover:text-blue-300"
              href="#"
            >
              {{ post.author }}
            </a>

            <span class="text-gray-400 dark:text-gray-600">
              ·
            </span>

            <small class="text-gray-500 dark:text-gray-400">
              {{ post.date_posted }}
            </small>

          </div>

          <!-- Post Title -->
          <h2 class="mb-2 text-2xl font-semibold leading-tight">

            <a
              class="text-gray-900 transition-colors hover:text-blue-600 dark:text-gray-100 dark:hover:text-blue-400"
              href="{{ url_for('post_page', post_id=post.id) }}"
            >
              {{ post.title }}
            </a>

          </h2>

          <!-- Post Content -->
          <p class="leading-7 text-gray-700 dark:text-gray-300">
            {{ post.content }}
          </p>

        </div>

      </div>

    </article>

  {% endfor %}

{% endblock content %}
