{% extends "layout.html" %}
{% block content %}

<article class="content-section mb-4 rounded-lg bg-white px-6 py-4 shadow-sm">
  <div class="flex items-start gap-4">
    <img
      class="h-16 w-16 shrink-0 rounded-full object-cover"
      src="{{ url_for('static', path='profile_pics/default.jpg') }}"
      alt="{{ post.author }}'s profile picture"
      width="64"
      height="64"
      loading="lazy"
    />

    <div class="min-w-0 flex-1">
      <div class="mb-2 flex items-center gap-2">
        <a
          class="text-sm font-medium text-gray-200 hover:text-blue-600"
          href="#"
        >
          {{ post.author }}
        </a>

        <small class="text-sm text-gray-400"> {{ post.date_posted }} </small>
      </div>

      <h2 class="mb-2 text-2xl font-semibold text-gray-900">
        {{ post.title }}
      </h2>

      <p class="text-base leading-7 dark:text-gray-200">{{ post.content }}</p>

      <!-- Only show edit/delete options if the user is the author -->
      <!-- TODO: Add user authentication and authorization -->

      <div class="mt-4 flex gap-2 border-t border-gray-200 pt-4">
        <a
          class="rounded-md border border-gray-400 px-4 py-2 text-sm font-medium text-gray-500 transition-colors hover:bg-gray-100"
          href="#"
        >
          Edit Post
        </a>

        <button
          type="button"
          class="rounded-md border border-red-500 px-4 py-2 text-sm font-medium text-red-600 transition-colors hover:bg-red-50"
          data-bs-toggle="modal"
          data-bs-target="#deleteModal"
        >
          Delete Post
        </button>
      </div>

      <!-- TODO: Add user authentication and authorization -->
    </div>
  </div>
</article>

<!-- Delete Confirmation Modal -->

<div
  class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50"
  id="deleteModal"
  tabindex="-1"
  aria-labelledby="deleteModalLabel"
  aria-hidden="true"
>
  <div class="w-full max-w-md rounded-lg bg-white shadow-xl">
    <div
      class="flex items-center justify-between border-b border-gray-200 px-6 py-4"
    >
      <h5 class="text-lg font-semibold text-gray-900" id="deleteModalLabel">
        Delete Post?
      </h5>

      <button
        type="button"
        class="text-2xl leading-none text-gray-400 hover:text-gray-600"
        data-bs-dismiss="modal"
        aria-label="Close"
      >
        &times;
      </button>
    </div>

    <!-- TODO: <form action="#" method="post"> -->

    <form action="#">
      <div class="px-6 py-5 text-gray-700">
        Are you sure you want to delete this post? This action cannot be undone.
      </div>

      <div class="flex justify-end gap-2 border-t border-gray-200 px-6 py-4">
        <button
          type="button"
          class="rounded-md border border-gray-400 px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100"
          data-bs-dismiss="modal"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="rounded-md border border-red-500 px-4 py-2 text-sm font-medium text-red-600 transition-colors hover:bg-red-50"
        >
          Delete
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock content %}
